version: '3.8'

services:
  ai-image-proxy:
    build: .
    container_name: fastgpt-ai-image-proxy
    restart: unless-stopped
    environment:
      # MinIO/S3 配置需要与 FastGPT 主站保持一致
      S3_ENDPOINT: ${S3_ENDPOINT:-fastgpt-minio}
      S3_PORT: ${S3_PORT:-9000}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_PLUGIN_BUCKET: ${S3_PLUGIN_BUCKET:-fastgpt-plugin}
      AI_IMAGE_BASE_FOLDER: ${AI_IMAGE_BASE_FOLDER:-middleware/ai-draw}
      AI_IMAGE_FETCH_TIMEOUT: ${AI_IMAGE_FETCH_TIMEOUT:-20}
      AI_IMAGE_MAX_SIZE: ${AI_IMAGE_MAX_SIZE:-20971520}
      AI_IMAGE_PUBLIC_BASE_URL: ${AI_IMAGE_PUBLIC_BASE_URL:-http://127.0.0.1:3000}
      AI_IMAGE_BEARER_TOKEN: ${AI_IMAGE_BEARER_TOKEN:-image-proxy-token}
    ports:
      - '8000:8000'
    depends_on:
      - fastgpt-minio

  fastgpt-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: fastgpt-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - ./data:/data
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
